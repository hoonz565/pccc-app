name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: firesafe
          POSTGRES_USER: firesafe
          POSTGRES_PASSWORD: firesafe_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U firesafe -d firesafe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://firesafe:firesafe_dev_password@127.0.0.1:5432/firesafe
      AUTH_SIGNING_SECRET: ci-test-only-signing-secret-with-at-least-32-characters
      RUN_DATABASE_TESTS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements-dev.lock
          python -m pip install --no-deps -e apps/api

      - name: Ruff check
        run: python -m ruff check apps/api

      - name: Ruff format check
        run: python -m ruff format --check apps/api

      - name: Mypy
        run: python -m mypy apps/api/src apps/api/tests

      - name: Alembic
        run: |
          python -m alembic -c apps/api/alembic.ini upgrade head
          python -m alembic -c apps/api/alembic.ini current

      - name: Pytest
        run: python -m pytest apps/api/tests

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Dart format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test
