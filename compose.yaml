name: firesafe

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-firesafe}
      POSTGRES_USER: ${POSTGRES_USER:-firesafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-firesafe_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-firesafe} -d ${POSTGRES_DB:-firesafe}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
